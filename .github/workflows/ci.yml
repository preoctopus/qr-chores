name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests tests_e2e

      - name: Format check (ruff)
        run: uv run ruff format --check src tests tests_e2e

      - name: Tests with coverage
        env:
          SECRET_KEY: "ci-test-secret-key"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          APP_TIMEZONE: "America/Chicago"
          BASE_URL: "http://testserver"
          PHOTO_STORAGE: "local"
        run: uv run pytest -q

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies (+ e2e)
        run: uv sync --extra dev --extra e2e

      - name: Install Playwright Chromium browser
        run: uv run playwright install --with-deps chromium

      - name: Playwright E2E UI tests
        run: uv run pytest tests_e2e

  client-mock-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install mock-api
        working-directory: clients/mock-api
        run: uv sync --extra dev

      - name: Lint mock-api
        working-directory: clients/mock-api
        run: uv run ruff check src tests

      - name: Test mock-api
        working-directory: clients/mock-api
        run: uv run pytest -q

  client-python:
    runs-on: ubuntu-latest
    needs: [client-mock-api]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install Python client (+ mock-api path dep)
        working-directory: clients/python
        run: uv sync --extra dev

      - name: Lint Python client
        working-directory: clients/python
        run: uv run ruff check src tests

      - name: Format check Python client
        working-directory: clients/python
        run: uv run ruff format --check src tests

      - name: Test Python client (unit + integration, cov ≥90)
        working-directory: clients/python
        run: uv run pytest -q

  client-kotlin:
    runs-on: ubuntu-latest
    needs: [client-mock-api]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (for mock-api integration tests)
        run: uv python install 3.12

      - name: Prefetch mock-api deps
        working-directory: clients/mock-api
        run: uv sync --extra dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit + integration tests + Kover
        working-directory: clients/kotlin
        run: ./gradlew test integrationTest koverVerify --no-daemon

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: qr-chores:ci
