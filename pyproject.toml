[project]
name = "qr-chores"
version = "0.1.0"
description = "Mobile-first family chore app with stable QR codes, points, and achievements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "pwdlib[argon2]>=0.2.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "greenlet>=3.5.4",
    "segno>=1.6.6",
    "google-cloud-storage>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
qr-chores = "qr_chores.main:run"
qr-chores-seed = "qr_chores.seed:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: multi-step flows across HTTP routes and persistence",
]
addopts = [
    "--strict-markers",
    "--cov=qr_chores",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=75",
]

[tool.coverage.run]
branch = true
source = ["qr_chores"]
# SQLAlchemy async uses greenlet; without this, async route bodies look uncovered.
concurrency = ["greenlet", "thread"]
omit = [
    "*/qr_chores/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",  # line length handled by formatter preference; keep flexible for templates/tests
    "B008",  # FastAPI Depends() in defaults is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"migrations/**/*.py" = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
