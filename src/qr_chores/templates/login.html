{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Parents manage chores. You complete them — scan a QR when you’re ready.</p>

  {% if error %}
  <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" autocomplete="username" required
             value="{{ email or '' }}" placeholder="you@example.com">
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required
             placeholder="••••••••">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted small" style="margin-top: 1rem; text-align: center;">
    <a href="/help">How QR Chores works</a>
  </p>
</section>
{% endblock %}
