<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ title or "QR Chores" }}{% endblock %} · QR Chores</title>
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/">QR Chores</a>
      {% if user is defined and user %}
      <div class="topbar-meta">
        <span class="user-chip">{{ user.display_name }}</span>
        <a class="btn btn-ghost btn-sm" href="/logout">Log out</a>
      </div>
      {% endif %}
    </header>
    {% if user is defined and user and user.role.value == "parent" %}
    <nav class="nav-tabs" aria-label="Parent">
      <a href="/today" class="nav-tab{% if request.url.path == '/today' %} is-active{% endif %}">Today</a>
      <a href="/history" class="nav-tab{% if request.url.path == '/history' %} is-active{% endif %}">History</a>
      <a href="/chores" class="nav-tab{% if request.url.path.startswith('/chores') or request.url.path.startswith('/print') %} is-active{% endif %}">Chores</a>
      <a href="/rewards" class="nav-tab{% if request.url.path.startswith('/rewards') %} is-active{% endif %}">Rewards</a>
    </nav>
    {% endif %}
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
